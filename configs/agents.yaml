# Agent 注册表

agents:
  # 系统 Agent
  - name: "planner"
    display_name: "规划专家"
    description: "分解复杂任务，制定实施计划"
    provider: "deepseek"
    model: "deepseek-chat"
    temperature: 0.7
    tools:
      - read_file
      - glob_search
      
  - name: "code-reviewer"
    display_name: "代码审查"
    description: "代码质量、安全、性能审查"
